# On push to branches (but not PRs) Build poetry env with caching and run tests
# Based on https://github.com/marketplace/actions/install-poetry-action

name: Unit Tests

# On push to branches (but not PRs) Build poetry env with caching and run tests
# Based on https://github.com/marketplace/actions/install-poetry-action
on: [ push, workflow_dispatch ]

env:
  PYTHON_VERSION: 3.12.1
  POETRY_VERSION: 1.8.3

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Public variant: proves we can resolve/install only public dependencies (no private index credentials)
          - os: ubuntu-latest
            private_index: false
            label: public
          # Private variant: enables private package index for full dependency resolution (including any private packages)
          - os: ubuntu-latest
            private_index: true
            label: private
        # Add more OSes if required (windows-latest, macOS-latest - mac is charged at higher cost)
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      # Check-out repo and set-up python
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # Manual Large File System fetch - workaround for github bug: https://github.com/actions/checkout/issues/270
      # Enable this if you have LFS-tracked files that are needed for tests
      # - name: Fetch large files from lfs
      #   run: git lfs checkout

      - name: Set up python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Try to load poetry installation from cache
      - name: Load cached Poetry installation
        id: cached-poetry
        uses: actions/cache@v4
        with:
          path: ~/.local  # the path depends on the OS
          key: poetry-${{ env.POETRY_VERSION }}  # change/increment key to reset cache

      # Install & configure poetry
      - name: Install Poetry
        run: |
          pip install --user pipx
            # Using pipx keeps poetry isolated & makes caching simpler
          pipx install poetry==${{ env.POETRY_VERSION }}
          poetry config virtualenvs.in-project true # necessary for .venv/ caching

      # First, install only public dependencies (verifies lock resolves without private index)
      - name: Install base (public) dependencies
        run: poetry install --no-interaction --sync

      # Load cached venv (separate cache per matrix label to avoid cross-contamination)
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        if: runner.os != 'Windows' # caching breaks on windows, known bug
        with:
          path: .venv
          key: venv-${{ matrix.label }}-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      # Inject private package index credentials only for private variant
      # Make sure these secrets are set in the repo or organization settings:
      # PRIVATE_PYPI_PUBLISH_URL, PRIVATE_PYPI_PUBLISH_USER, PRIVATE_PYPI_PUBLISH_PASSWORD
      - name: Inject private index credentials
        if: matrix.private_index
        run: |
          echo "PUBLISH_URL=${{ secrets.PRIVATE_PYPI_PUBLISH_URL }}" >> $GITHUB_ENV
          echo "PUBLISH_USER=${{ secrets.PRIVATE_PYPI_PUBLISH_USER }}" >> $GITHUB_ENV
          echo "PUBLISH_PASSWORD=${{ secrets.PRIVATE_PYPI_PUBLISH_PASSWORD }}" >> $GITHUB_ENV

      # Adds private package index URL and credentials to the poetry config, for installing from and publishing to the private package index.
      - name: Add Private Package Index
        if: matrix.private_index && env.PUBLISH_URL != ''
        run: |
          poetry config repositories.csiroenergy "$PUBLISH_URL"
          poetry config http-basic.csiroenergy "$PUBLISH_USER" "$PUBLISH_PASSWORD"

      # Install full dependency set (with extras, and private packages if enabled) on cache miss (or always on Windows)
      - name: Install full dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true' || runner.os == 'Windows'
        run: poetry install --no-interaction --sync --all-extras

      # Run test suite
      - name: Run tests
        run: |
          poetry run pre-commit run --color never
          poetry run poe unit_tests

      - name: Generate docs
        run: poetry run poe doc
